apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: new-pipeline-zdx2ad
  namespace: myproject
  finalizers:
    - chains.tekton.dev/pipelinerun
    - results.tekton.dev/pipelinerun
  labels:
    tekton.dev/pipeline: new-pipeline
spec:
  params:
    - name: GIT_URL
      value: 'https://gitlab.com/hikaru-nomura/openshift-handson.git'
    - name: DOCKERFILE_PATH
      value: ./pipeline-experience/sample-app/source/Dockerfile
    - name: SOURCE_PATH
      value: ./pipeline-experience/sample-app/source
    - name: INTERNAL_REGISTRY_URL
      value: 'image-registry.openshift-image-registry.svc:5000/myproject/log-test'
  pipelineRef:
    name: new-pipeline
  taskRunTemplate:
    serviceAccountName: pipeline
  timeouts:
    pipeline: 1h0m0s
  workspaces:
    - name: workspace
      persistentVolumeClaim:
        claimName: workspace-pvc